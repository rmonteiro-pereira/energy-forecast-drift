[project]
name = "energy-forecast-drift"
version = "0.1.0"
description = "Hourly electricity demand forecasting with live drift monitoring (EIA + Open-Meteo)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=25.0.0",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "lightgbm>=4.3",
    "mlflow>=2.16",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "matplotlib>=3.11.1",
]

[project.optional-dependencies]
# CI installs with `uv sync --extra dev --frozen`, so every tool CI runs has to
# live here. A `[dependency-groups]` entry would be installed by a bare local
# `uv sync` and silently missing on the runner -- which is exactly how a green
# laptop produces a red build.
dev = [
    "evidently>=0.7.21",
    "mutmut>=2.4,<3",
    "mypy>=2.3.0",
    "pandas-stubs>=3.0.5.260730",
    "pytest>=8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20260724",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest", "features", "models", "drift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly so a ruff upgrade cannot silently change what CI enforces.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

# ---------------------------------------------------------------------------
# mypy
#
# Type checking here is deliberately *scoped*, and the reasoning is in
# docs/adr/0002-scoped-type-checking.md. In short: `pandas-stubs` cannot narrow
# the element type of a Series, so a single expression like
# `df.index.max() - pd.Timedelta(...)` expands into a dozen "no overload
# variant" errors that describe the stubs, not the code. Running strict mypy
# over the dataframe plumbing produces ~250 such errors and the only way to
# silence them is `cast()` and `# type: ignore` at nearly every line -- which
# makes the codebase harder to read and the checker meaningless.
#
# So: the modules whose correctness is *logical* rather than dataframe-shaped
# are checked strictly and must stay clean. The dataframe plumbing is checked
# with the stub-noise error codes off, so genuine problems (undefined names,
# bad calls, unreachable code) are still caught there.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["ingest", "features", "models", "drift", "pipeline", "serving"]
ignore_missing_imports = true      # lightgbm, mlflow and evidently ship no stubs
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

# The pure-logic core: the statistics, the retrain policy, the thresholds, the
# HTTP layer and the secret redaction. These have real invariants that types can
# actually protect, they touch pandas lightly or not at all, and they are clean
# today. Tightening them is cheap; letting them rot is not.
[[tool.mypy.overrides]]
module = [
    "drift.config",
    "drift.stats",
    "drift.trigger",
    "drift.simulate",
    "ingest.config",
    "ingest.http",
    "models.fixtures",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
strict_equality = true

# The dataframe plumbing. Still checked -- just not against stub limitations
# that no amount of correct code can satisfy.
[[tool.mypy.overrides]]
module = [
    "drift.detectors",
    "drift.windows",
    "features.build",
    "features.panel",
    "ingest.eia",
    "ingest.store",
    "models.backtest",
    "models.lgbm",
    "models.train",
    "models.__main__",
    "pipeline.daily",
    "pipeline.plots",
    "serving.app",
]
disable_error_code = ["operator", "arg-type", "union-attr", "index", "call-overload"]

# ---------------------------------------------------------------------------
# mutmut -- mutation testing
#
# Scoped to the two places where a passing test suite would be most misleading:
#   * drift/detectors.py  -- the four detectors. A comparison flipped from `>=`
#     to `>` here is the difference between an alarm that fires and one that
#     silently never does, and the fixture is quiet enough that ordinary tests
#     can pass either way.
#   * models/backtest.py  -- the walk-forward split and the leakage guards.
#     `index < cutoff` becoming `index <= cutoff` is a one-character temporal
#     leak that makes every metric look better and breaks nothing visibly.
#
# Not run on every push: a full pass takes tens of minutes, which is the wrong
# trade for a typo fix. It *is* run in CI -- .github/workflows/mutation.yml, on
# pull requests that touch these two modules or `tests/`, weekly for dependency
# drift, and on demand -- and the score is recorded in docs/MUTATION-TESTING.md
# with the surviving mutants listed rather than summarised. (This comment read
# "Not run in CI" for a week after that workflow landed. It is exactly the genre
# of stale claim the rest of this repository is built to catch.)
#
#   uv run --extra dev mutmut run
#   uv run --extra dev mutmut results
# ---------------------------------------------------------------------------
[tool.mutmut]
paths_to_mutate = "drift/detectors.py,models/backtest.py"
tests_dir = "tests/"
runner = "python -m pytest -x -q -p no:warnings --no-header tests/test_drift_detectors.py tests/test_drift_boundaries.py tests/test_drift_timeline.py tests/test_drift_trigger.py tests/test_backtest.py tests/test_backtest_accounting.py tests/test_baseline.py"
