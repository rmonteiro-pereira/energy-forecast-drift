# ============================================================================
# INACTIVE UNTIL PUBLISHED — this is the M5 "live" cron. It is drafted early on
# purpose: the value of the project is drift accumulating over weeks, so the
# clock should start the moment the repo goes public.
#
# It cannot run yet because:
#   1. the repo has no remote — nothing to schedule against;
#   2. EIA_API_KEY does not exist yet. See docs/BLOCKED.md.
#
# TO ACTIVATE (in order):
#   [ ] push the repo to GitHub (public => Actions minutes are free)
#   [ ] Settings > Secrets and variables > Actions > New repository secret:
#         EIA_API_KEY = <your key from eia.gov/opendata/register.php>
#   [ ] Settings > Actions > General > Workflow permissions:
#         "Read and write permissions"  (needed to commit metrics/)
#   [ ] uncomment the `schedule:` block below
#   [ ] run it once manually via the Actions tab to confirm it is green
#
# Note on scheduling: the EIA publishes ~2x/day, so a single daily run is the
# right cadence to start. 06:20 UTC is deliberately off the hour — GitHub
# throttles the top-of-hour stampede and delays those runs.
#
# Note on shape: this workflow runs ONE command. Everything the cron does —
# ingest, features, score, the rolling-MAE monitor, drift, the artifacts and
# the PNGs — lives in `pipeline/daily.py`, which has tests and runs locally.
# A pipeline spread across ten YAML steps can only be debugged by pushing.
# ============================================================================

name: daily (ingest -> score -> drift -> commit metrics)

on:
  # schedule:
  #   - cron: "20 6 * * *"
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Re-pull the whole backfill window instead of the delta"
        type: boolean
        default: false

permissions:
  contents: write # to commit metrics/ back to the repo

concurrency:
  # Never let two runs write metrics/ at the same time.
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      # ------------------------------------------------------------------
      # The lake itself is gitignored, so a runner starts empty and would
      # re-backfill 2 years every day. Caching it keeps each run to a delta
      # pull, which is the whole point of incremental + idempotent ingestion.
      # The MLflow registry is cached alongside it: without it every run
      # would have no champion to serve and would refit from scratch.
      # ------------------------------------------------------------------
      - name: Restore data lake and MLflow state
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            mlflow.db
            mlruns
          key: lake-${{ github.run_id }}
          restore-keys: lake-

      # ------------------------------------------------------------------
      # The whole loop, in one command that also runs on a laptop.
      #
      # `--require-eia-key` makes a missing key a hard failure with printed
      # instructions instead of a silent fall back to the synthetic fixture.
      # A cron that quietly publishes fixture numbers as if they were data is
      # the single worst failure mode this repo has, so it is made impossible
      # here rather than warned about.
      # ------------------------------------------------------------------
      - name: Run the daily pipeline
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          uv run python -m pipeline.daily \
            --require-eia-key \
            --source real \
            ${{ inputs.full_refresh && '--full-refresh' || '' }}

      - name: Save data lake and MLflow state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data
            mlflow.db
            mlruns
          key: lake-${{ github.run_id }}

      # The run record is written even when the pipeline fails, so upload it
      # either way — a red run that explains itself is worth keeping.
      - name: Upload the run record
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-run-${{ github.run_id }}
          path: metrics/pipeline.json
          if-no-files-found: warn

      - name: Commit refreshed metrics
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Explicit paths only: raw parquet and MLflow state must never reach
          # the repo, and a wildcard `git add metrics/` would be one .gitignore
          # mistake away from committing the lake.
          git add metrics/forecast.json \
                  metrics/monitor.json \
                  metrics/drift.json \
                  metrics/drift_summary.md \
                  metrics/pipeline.json \
                  metrics/forecast_vs_actual.png \
                  metrics/rolling_mae.png
          if git diff --staged --quiet; then
            echo "metrics unchanged — nothing to commit"
          else
            git commit -m "chore(metrics): daily refresh [skip ci]"
            git push
          fi
