# ============================================================================
# DORMANT, NOT BROKEN — this is the M5 "live" cron. The repo is published, so
# step 1 below is done; what is still missing is the key.
#
# Behaviour without EIA_API_KEY: the preflight step below detects the missing
# secret, emits a warning annotation, and the job ends GREEN having written and
# published nothing. It does not go red. That distinction matters now the repo
# is public: a red X on the only scheduled workflow reads as "this project is
# broken", when the truth is "this project is waiting for a free API key" — and
# the thing that actually must never happen (publishing fixture numbers as if
# they were data) is prevented either way.
#
# TO ACTIVATE (in order):
#   [x] push the repo to GitHub (public => Actions minutes are free)
#   [x] Settings > Secrets and variables > Actions > New repository secret:
#         EIA_API_KEY = <your key from eia.gov/opendata/register.php>
#         Done 2026-08-01T21:06Z.
#   [~] Settings > Actions > General > Workflow permissions: NOT needed after all.
#         The repo sits on "read" and run 30718525099 still reached the branch
#         protection hook, which only happens with a write token — the
#         `permissions:` block below escalates on its own. A read-only token
#         would have given 403, not GH006. Left here because this line used to
#         claim the opposite.
#   [ ] Settings > Actions > General: "Allow GitHub Actions to create and
#         approve pull requests" — needed by the last step, which opens a PR
#         rather than pushing at protected `main`. Without it the branch is
#         still pushed and the step degrades to a warning with a link.
#   [ ] uncomment the `schedule:` block below
#   [x] run it once manually via the Actions tab to confirm it is green
#         Run 30718525099, 2026-08-01: the pipeline itself went green against
#         real EIA data; only the publish step failed, which is what the PR
#         flow below fixes.
#
# Note on scheduling: the EIA publishes ~2x/day, so a single daily run is the
# right cadence to start. 06:20 UTC is deliberately off the hour — GitHub
# throttles the top-of-hour stampede and delays those runs.
#
# Note on shape: this workflow runs ONE command. Everything the cron does —
# ingest, features, score, the rolling-MAE monitor, drift, the artifacts and
# the PNGs — lives in `pipeline/daily.py`, which has tests and runs locally.
# A pipeline spread across ten YAML steps can only be debugged by pushing.
# ============================================================================

name: daily (ingest -> score -> drift -> commit metrics)

on:
  # schedule:
  #   - cron: "20 6 * * *"
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Re-pull the whole backfill window instead of the delta"
        type: boolean
        default: false

permissions:
  contents: write # to push the metrics branch
  pull-requests: write # to open the PR that carries it to main

concurrency:
  # Never let two runs write metrics/ at the same time.
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # ------------------------------------------------------------------
      # Preflight: is there a key at all?
      #
      # Everything after this is conditional on the answer. Without a key there
      # is nothing real to ingest, so the run does no work and ends green with a
      # warning annotation rather than burning three minutes to exit 2 and paint
      # the Actions tab red on a public repo.
      #
      # This is NOT a softening of the safety rule. The rule is "never publish
      # fixture numbers as though they were data", and doing nothing at all
      # satisfies it more completely than failing does. `--require-eia-key` stays
      # on the run step below to cover the other case: a secret that exists but
      # is empty or rejected mid-run.
      # ------------------------------------------------------------------
      - name: Preflight — is EIA_API_KEY configured?
        id: preflight
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          set -euo pipefail

          if [ -n "${EIA_API_KEY:-}" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
            echo "EIA_API_KEY is configured - running the pipeline against real data."
            exit 0
          fi

          echo "has_key=false" >> "$GITHUB_OUTPUT"

          # No colon inside the title= value: the annotation parser splits on `::`.
          echo "::warning title=Dormant - no EIA_API_KEY::The pipeline was skipped and nothing was published. This is the documented state of the project, not a failure. See docs/BLOCKED.md."

          # A heredoc rather than chained echos: no backslash continuations to
          # mangle, and backticks stay literal because the delimiter is quoted.
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### Dormant - no `EIA_API_KEY` configured

          The daily pipeline was **skipped**. Nothing was ingested, scored, or committed.

          This is the documented state of the project, not a failure. Every artifact in
          `metrics/` is derived from a seeded synthetic fixture and carries
          `"is_real": false` until a real key lands.

          To activate it, see **docs/BLOCKED.md** in the repository root.
          SUMMARY

      - name: Install uv
        if: steps.preflight.outputs.has_key == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        if: steps.preflight.outputs.has_key == 'true'
        run: uv sync --extra dev --frozen

      # ------------------------------------------------------------------
      # The lake itself is gitignored, so a runner starts empty and would
      # re-backfill 2 years every day. Caching it keeps each run to a delta
      # pull, which is the whole point of incremental + idempotent ingestion.
      # The MLflow registry is cached alongside it: without it every run
      # would have no champion to serve and would refit from scratch.
      # ------------------------------------------------------------------
      - name: Restore data lake and MLflow state
        if: steps.preflight.outputs.has_key == 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            data
            mlflow.db
            mlruns
          key: lake-${{ github.run_id }}
          restore-keys: lake-

      # ------------------------------------------------------------------
      # The whole loop, in one command that also runs on a laptop.
      #
      # `--require-eia-key` makes a missing key a hard failure with printed
      # instructions instead of a silent fall back to the synthetic fixture.
      # A cron that quietly publishes fixture numbers as if they were data is
      # the single worst failure mode this repo has, so it is made impossible
      # here rather than warned about.
      # ------------------------------------------------------------------
      - name: Run the daily pipeline
        if: steps.preflight.outputs.has_key == 'true'
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          uv run python -m pipeline.daily \
            --require-eia-key \
            --source real \
            ${{ inputs.full_refresh && '--full-refresh' || '' }}

      # `success()`, deliberately not `always()`. Caching after a failed run can
      # persist a half-updated `data/`, `mlflow.db` or `mlruns/` -- and because
      # the next run restores from that key, one bad run would poison every run
      # after it, with no obvious symptom. Losing a delta pull costs one extra
      # API call; restoring corrupt MLflow state costs a debugging session.
      - name: Save data lake and MLflow state
        uses: actions/cache/save@v6
        if: success() && steps.preflight.outputs.has_key == 'true'
        with:
          path: |
            data
            mlflow.db
            mlruns
          key: lake-${{ github.run_id }}

      # `always()` IS right here, unlike the cache step above. The run record is
      # written even when the pipeline fails, and a failed run that explains
      # itself is the whole reason it is written. An artifact is read by a human
      # once; a cache is consumed by every later run.
      - name: Upload the run record
        uses: actions/upload-artifact@v7
        if: always() && steps.preflight.outputs.has_key == 'true'
        with:
          name: pipeline-run-${{ github.run_id }}
          path: metrics/pipeline.json
          if-no-files-found: warn

      # ------------------------------------------------------------------
      # A PR, not a push at `main` — and this is measured, not preferred.
      #
      # Run 30718525099 ingested two years of real EIA demand, scored, ran the
      # drift check, and then died on the last line of the old version of this
      # step:
      #
      #   remote: error: GH006: Protected branch update failed for refs/heads/main.
      #   remote: - Required status check "test" is expected.
      #   ! [remote rejected] main -> main (protected branch hook declined)
      #
      # `main` requires the `test` check, and `github-actions[bot]` is not an
      # admin, so it does not inherit the `enforce_admins: false` bypass. A bot
      # pushing straight at a protected branch can only ever be rejected — the
      # whole pipeline was green and published nothing.
      #
      # There is deliberately NO `[skip ci]` in the commit message any more.
      # `test` is a *required* check: a commit that skips CI can never be
      # merged, because the check it is waiting on never reports. The PR would
      # sit on "Expected — Waiting for status to be reported" forever. That is
      # the same defect the mutation check had (#19), one branch over, and
      # carrying `[skip ci]` into a PR flow would have rebuilt it here.
      # ------------------------------------------------------------------
      - name: Open a PR with the refreshed metrics
        if: steps.preflight.outputs.has_key == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Explicit paths only: raw parquet and MLflow state must never reach
          # the repo, and a wildcard `git add metrics/` would be one .gitignore
          # mistake away from committing the lake.
          git add metrics/forecast.json \
                  metrics/monitor.json \
                  metrics/drift.json \
                  metrics/drift_summary.md \
                  metrics/pipeline.json \
                  metrics/forecast_vs_actual.png \
                  metrics/rolling_mae.png

          if git diff --staged --quiet; then
            echo "metrics unchanged — nothing to commit"
            exit 0
          fi

          git commit -m "chore(metrics): daily refresh"

          # A fresh branch per run, never reused and so never force-pushed.
          # Reusing one branch would require a force after every merge — once
          # the PR lands, the old tip stops being an ancestor and a
          # fast-forward becomes impossible. Forcing is the wrong tool for an
          # unattended job: it is unreviewable, and it would let a later run
          # rewrite a PR while somebody is reading it. Per-run branches cost a
          # ref, which merging deletes.
          branch="metrics/daily-${GITHUB_RUN_ID}"

          # Counted BEFORE the new PR exists, so it never counts itself.
          #
          # This used to be a supersede list: the step closed yesterday's PR
          # when it opened today's. That was wrong, and wrong in the direction
          # that hurts most. An open metrics PR is one that was never merged,
          # so closing it threw away a day that was never published — and since
          # every run recomputes fixed rolling windows (`drift/config.py`), the
          # week-over-week accumulation this project exists to show lives ONLY
          # in the git history of merged refreshes. The tidying loop was
          # deleting the product.
          #
          # So nothing is closed here any more. Merged predecessors leave the
          # `open` list on their own; the ones that linger are exactly the days
          # that failed to publish, and they are supposed to be visible.
          unpublished=$(gh pr list --base main --state open \
                          --json number,headRefName \
                          --jq '[.[] | select(.headRefName | startswith("metrics/daily-")) | .number] | length')

          git push origin "HEAD:refs/heads/${branch}"

          # `gh pr create` fails hard when "Allow GitHub Actions to create and
          # approve pull requests" is off. That is a settings decision, not a
          # broken run: the commit is already pushed and all that is missing is
          # one click. So that ONE error degrades to a warning carrying the
          # link — and every other error still fails the step, because a
          # blanket `|| true` here is exactly how a publish step goes green
          # having published nothing.
          err="${RUNNER_TEMP}/pr-create.err"
          if url=$(gh pr create --base main --head "$branch" \
               --title "chore(metrics): daily refresh" \
               --body "Automated refresh from run ${GITHUB_RUN_ID}. Merging publishes the numbers in \`metrics/\`." 2> "$err"); then

            # Auto-merge, not a daily click. Branch protection still decides:
            # this publishes only what `test` and `mutate` have already passed,
            # and it queues rather than merging if they have not. A refresh that
            # needs a human every morning is not a daily pipeline, it is a chore
            # with a cron attached — and an unmerged day is a lost day.
            gh pr merge "${url##*/}" --auto --squash \
              || echo "::warning title=Auto-merge not armed::The PR is open but will not merge itself; publish it by hand."

            # The alarm the old close loop silenced. Zero is the healthy state:
            # yesterday merged and left the open list. Anything else means days
            # are stacking up unpublished, and past a couple of days that is not
            # a hiccup, it is a broken publish path that should not go on
            # quietly producing more work nobody is reading.
            if [ "${unpublished}" -gt 0 ]; then
              echo "::warning title=${unpublished} unpublished refresh(es)::Earlier metrics PRs never merged. Nothing was discarded, but nothing was published either."
            fi
            if [ "${unpublished}" -ge 3 ]; then
              echo "Three or more metrics PRs are open and unmerged: publication is broken, not slow." >&2
              exit 1
            fi
            exit 0
          fi

          cat "$err"
          if grep -qi "not permitted to create or approve pull requests" "$err"; then
            echo "::warning title=PR not created::Actions may not open PRs in this repo. The metrics branch was pushed - open the PR manually from the link in the summary."
            {
              echo "Metrics pushed to \`${branch}\`, but Actions is not permitted to open"
              echo "PRs here. [Open it manually](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit 1
