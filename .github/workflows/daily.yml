# ============================================================================
# DORMANT, NOT BROKEN — this is the M5 "live" cron. The repo is published, so
# step 1 below is done; what is still missing is the key.
#
# Behaviour without EIA_API_KEY: the preflight step below detects the missing
# secret, emits a warning annotation, and the job ends GREEN having written and
# published nothing. It does not go red. That distinction matters now the repo
# is public: a red X on the only scheduled workflow reads as "this project is
# broken", when the truth is "this project is waiting for a free API key" — and
# the thing that actually must never happen (publishing fixture numbers as if
# they were data) is prevented either way.
#
# TO ACTIVATE (in order):
#   [x] push the repo to GitHub (public => Actions minutes are free)
#   [ ] Settings > Secrets and variables > Actions > New repository secret:
#         EIA_API_KEY = <your key from eia.gov/opendata/register.php>
#   [ ] Settings > Actions > General > Workflow permissions:
#         "Read and write permissions"  (needed to commit metrics/)
#   [ ] uncomment the `schedule:` block below
#   [ ] run it once manually via the Actions tab to confirm it is green
#
# Note on scheduling: the EIA publishes ~2x/day, so a single daily run is the
# right cadence to start. 06:20 UTC is deliberately off the hour — GitHub
# throttles the top-of-hour stampede and delays those runs.
#
# Note on shape: this workflow runs ONE command. Everything the cron does —
# ingest, features, score, the rolling-MAE monitor, drift, the artifacts and
# the PNGs — lives in `pipeline/daily.py`, which has tests and runs locally.
# A pipeline spread across ten YAML steps can only be debugged by pushing.
# ============================================================================

name: daily (ingest -> score -> drift -> commit metrics)

on:
  # schedule:
  #   - cron: "20 6 * * *"
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Re-pull the whole backfill window instead of the delta"
        type: boolean
        default: false

permissions:
  contents: write # to commit metrics/ back to the repo

concurrency:
  # Never let two runs write metrics/ at the same time.
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # ------------------------------------------------------------------
      # Preflight: is there a key at all?
      #
      # Everything after this is conditional on the answer. Without a key there
      # is nothing real to ingest, so the run does no work and ends green with a
      # warning annotation rather than burning three minutes to exit 2 and paint
      # the Actions tab red on a public repo.
      #
      # This is NOT a softening of the safety rule. The rule is "never publish
      # fixture numbers as though they were data", and doing nothing at all
      # satisfies it more completely than failing does. `--require-eia-key` stays
      # on the run step below to cover the other case: a secret that exists but
      # is empty or rejected mid-run.
      # ------------------------------------------------------------------
      - name: Preflight — is EIA_API_KEY configured?
        id: preflight
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          set -euo pipefail

          if [ -n "${EIA_API_KEY:-}" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
            echo "EIA_API_KEY is configured - running the pipeline against real data."
            exit 0
          fi

          echo "has_key=false" >> "$GITHUB_OUTPUT"

          # No colon inside the title= value: the annotation parser splits on `::`.
          echo "::warning title=Dormant - no EIA_API_KEY::The pipeline was skipped and nothing was published. This is the documented state of the project, not a failure. See docs/BLOCKED.md."

          # A heredoc rather than chained echos: no backslash continuations to
          # mangle, and backticks stay literal because the delimiter is quoted.
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### Dormant - no `EIA_API_KEY` configured

          The daily pipeline was **skipped**. Nothing was ingested, scored, or committed.

          This is the documented state of the project, not a failure. Every artifact in
          `metrics/` is derived from a seeded synthetic fixture and carries
          `"is_real": false` until a real key lands.

          To activate it, see **docs/BLOCKED.md** in the repository root.
          SUMMARY

      - name: Install uv
        if: steps.preflight.outputs.has_key == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        if: steps.preflight.outputs.has_key == 'true'
        run: uv sync --extra dev --frozen

      # ------------------------------------------------------------------
      # The lake itself is gitignored, so a runner starts empty and would
      # re-backfill 2 years every day. Caching it keeps each run to a delta
      # pull, which is the whole point of incremental + idempotent ingestion.
      # The MLflow registry is cached alongside it: without it every run
      # would have no champion to serve and would refit from scratch.
      # ------------------------------------------------------------------
      - name: Restore data lake and MLflow state
        if: steps.preflight.outputs.has_key == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            mlflow.db
            mlruns
          key: lake-${{ github.run_id }}
          restore-keys: lake-

      # ------------------------------------------------------------------
      # The whole loop, in one command that also runs on a laptop.
      #
      # `--require-eia-key` makes a missing key a hard failure with printed
      # instructions instead of a silent fall back to the synthetic fixture.
      # A cron that quietly publishes fixture numbers as if they were data is
      # the single worst failure mode this repo has, so it is made impossible
      # here rather than warned about.
      # ------------------------------------------------------------------
      - name: Run the daily pipeline
        if: steps.preflight.outputs.has_key == 'true'
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          uv run python -m pipeline.daily \
            --require-eia-key \
            --source real \
            ${{ inputs.full_refresh && '--full-refresh' || '' }}

      # `success()`, deliberately not `always()`. Caching after a failed run can
      # persist a half-updated `data/`, `mlflow.db` or `mlruns/` -- and because
      # the next run restores from that key, one bad run would poison every run
      # after it, with no obvious symptom. Losing a delta pull costs one extra
      # API call; restoring corrupt MLflow state costs a debugging session.
      - name: Save data lake and MLflow state
        uses: actions/cache/save@v4
        if: success() && steps.preflight.outputs.has_key == 'true'
        with:
          path: |
            data
            mlflow.db
            mlruns
          key: lake-${{ github.run_id }}

      # `always()` IS right here, unlike the cache step above. The run record is
      # written even when the pipeline fails, and a failed run that explains
      # itself is the whole reason it is written. An artifact is read by a human
      # once; a cache is consumed by every later run.
      - name: Upload the run record
        uses: actions/upload-artifact@v4
        if: always() && steps.preflight.outputs.has_key == 'true'
        with:
          name: pipeline-run-${{ github.run_id }}
          path: metrics/pipeline.json
          if-no-files-found: warn

      - name: Commit refreshed metrics
        if: steps.preflight.outputs.has_key == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Explicit paths only: raw parquet and MLflow state must never reach
          # the repo, and a wildcard `git add metrics/` would be one .gitignore
          # mistake away from committing the lake.
          git add metrics/forecast.json \
                  metrics/monitor.json \
                  metrics/drift.json \
                  metrics/drift_summary.md \
                  metrics/pipeline.json \
                  metrics/forecast_vs_actual.png \
                  metrics/rolling_mae.png
          if git diff --staged --quiet; then
            echo "metrics unchanged — nothing to commit"
          else
            git commit -m "chore(metrics): daily refresh [skip ci]"
            git push
          fi
