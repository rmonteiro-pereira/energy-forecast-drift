# Tests + the no-leakage guarantees. Runs on every push once the repo is
# published; it needs no secrets and touches no network (the API clients are
# exercised against httpx.MockTransport).

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------------------
  # The dashboard is a separate job because it is a separate toolchain, and
  # because it was previously not built here at all.
  #
  # That gap was not theoretical. Dependabot opened three PRs against
  # `dashboard/` (vitest 2 -> 4, @vitejs/plugin-react 4 -> 6, react-dom 19) and
  # all three reported CLEAN with a green `ci` tick — while every one of them
  # fails `npm ci` outright: a lockfile out of sync, a peer requirement on
  # vite ^8 against our vite 5, and react-dom 19 pinned beside react 18. CI was
  # green because CI never ran npm.
  #
  # A green tick that does not cover the thing being changed is worse than no
  # tick, because it is read as evidence. So the dashboard now builds here.
  # -------------------------------------------------------------------------
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      # `npm ci` rather than `npm install`: it fails when package.json and the
      # lockfile disagree, which is exactly how dependabot PR #7 was broken.
      - name: Install (fails on a lockfile that disagrees with package.json)
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # The build silently producing nothing would be worse than failing.
      - name: The build must actually emit a site
        run: |
          test -f dist/index.html
          test -d dist/assets
          test -d dist/data
          test -f dist/data/drift.json
          echo "dist/ contains $(find dist -type f | wc -l) files"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Only the `uv sync` step below passes `--frozen`; every `uv run` after it
    # re-resolves against pyproject.toml and rewrites uv.lock. That is not
    # theoretical: adding one optional extra locally, then running `uv run`, took
    # the lockfile from 152 to 185 packages -- including eighteen NVIDIA/CUDA
    # wheels -- with no `uv lock` ever typed. On a runner the same behaviour turns
    # a supposedly pinned install into a fresh resolve. UV_FROZEN makes every
    # `uv run` in this job read the lock instead of the manifest.
    env:
      UV_FROZEN: "1"

    steps:
      - uses: actions/checkout@v7

      # The interpreter is pinned, and it has to be. `requires-python = ">=3.11"`
      # lets uv pick the newest Python on the runner, which was 3.12 — while
      # `[tool.mypy] python_version = "3.11"` told mypy to analyse under 3.11
      # rules. mypy then read numpy's 3.12-installed stubs, hit a `type`
      # statement, and failed with a syntax error that had nothing to do with
      # this codebase. Locally it passed, because the local venv is 3.11.
      #
      # `.python-version` is what uv actually reads; this is stated here too so
      # the version is visible in the workflow rather than only in a dotfile.
      # `tests/test_toolchain.py` asserts the two never drift apart again.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # Scoped on purpose -- see docs/adr/0002-scoped-type-checking.md. The
      # pure-logic core is checked strictly; the dataframe plumbing is checked
      # with the pandas-stub noise codes off so real problems still surface.
      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest -v

      # ---------------------------------------------------------------------
      # The foundation lane. Three gates, and each one exists because its
      # earlier wording was green on the defect it was written to catch.
      # ---------------------------------------------------------------------

      # G5. Two of the three conditions here are true of a repository with no
      # lane in it at all -- torch absent, sync line clean -- so on their own
      # they are a gate with no reachable red state. The third one is the gate:
      # the adapter must import without dragging torch in, because pytest fails
      # at *collection* on a missing import while mypy reports Success on the
      # same file (`ignore_missing_imports = true`). Two checkers, opposite
      # verdicts, and only one of them is loud.
      - name: The lane must not put torch in the test job
        run: |
          if uv run python -c "import torch" 2>/dev/null; then
            echo "::error::torch is installed in the test job; it belongs to --extra foundation"
            exit 1
          fi
          uv run python - <<'PY'
          import sys
          import foundation.tsfm  # noqa: F401 - imported for the side effect being asserted
          if "torch" in sys.modules:
              print("::error::importing foundation.tsfm pulled torch into sys.modules")
              sys.exit(1)
          print("foundation.tsfm imports clean, torch absent")
          PY

      # G6. The repo-wide size ceiling, measured against the *committed objects*.
      # `find | grep -q` (the metrics/ guard above) answers a different question:
      # it reads the working tree, so it flags a tracked file that is small in the
      # index and bloated on disk, and misses nothing that is actually versioned.
      # And a bare `awk '$4 > N'` prints the violation and exits 0 -- as a `run:`
      # step that is a green tick over a red finding.
      - name: Nothing versioned may exceed 5,242,880 bytes
        run: |
          git ls-tree -r -l HEAD \
            | awk '$4 > 5242880 { print "::error::" $4 " bytes: " $5; bad = 1 } END { exit bad }'

      # G9. `pyproject.toml` sets `addopts = "-q"`, so a second `-q` becomes `-qq`
      # and pytest prints no summary line at all -- a gate parsing that output for
      # "N skipped" is green precisely when there are skips. `-o addopts=` clears
      # it. The lane may not skip: the smallest checkpoint is 6.6x the size
      # ceiling and this job has no network, so a skipped lane test would be the
      # whole lane reporting green while proving nothing.
      #
      # The file list is derived, not typed. A hand-kept list of test files is
      # the failure this repository already designs against in
      # `.github/mutation-paths.txt` ("two lists that must agree by hand is the
      # failure mode this file designs out") — and it bit here immediately: the
      # step named three lane test files while the lane had six.
      # `tests/test_workflows.py` recomputes this set from the imports and fails
      # if the step and the tree disagree.
      - name: The foundation lane must run, not skip
        run: |
          files=$(grep -rlE '^(from foundation|import foundation|from models import .*\barms\b|from models\.arms)' tests/ | sort | tr '\n' ' ')
          echo "lane test files: $files"
          test -n "$files" || { echo "::error::no lane test files found"; exit 1; }
          uv run python -m pytest -o addopts= -p no:cacheprovider --no-header -rN \
            $files \
            | tee /tmp/lane.txt
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then exit "$code"; fi
          if grep -qE '[0-9]+ skipped' /tmp/lane.txt; then
            echo "::error::a foundation-lane test was skipped; a skipped test reports green"
            exit 1
          fi
          grep -qE '[0-9]+ passed' /tmp/lane.txt || {
            echo "::error::the lane suite collected nothing — the gate would pass vacuously"
            exit 1
          }

      # Smoke test the whole M1 path on the synthetic fixture, so a broken
      # backtest is caught here rather than by the daily cron.
      - name: Backtest smoke test (synthetic fixture)
        run: uv run python -m models --source synthetic --weeks 2 --out-dir /tmp/smoke

      # M2 + M3 end to end: LightGBM walk-forward, MLflow tracking, registry
      # write. The unit suite deliberately does not create the MLflow schema
      # (alembic migrations are slow), so this is where that path is covered.
      - name: LightGBM + MLflow smoke test (synthetic fixture)
        run: uv run python -m models.train --source synthetic --weeks 2 --out-dir /tmp/smoke

      # M4: the four detectors + the retrain verdict, on the same fixture.
      # `--no-evidently` because the second opinion is an optional dependency
      # and its HTML report is ~5MB — the unit suite covers it separately.
      - name: Drift suite smoke test (synthetic fixture)
        run: |
          uv run python -m drift.run --source synthetic --no-evidently \
            --train-stride-hours 12 --num-boost-round 60 --out /tmp/smoke/drift.json

      # The alarm has to fire, not just run. An injected level shift must flip
      # the verdict to `retrain`, which `--fail-on-retrain` turns into exit 1 —
      # so this step passing means the detector went off.
      - name: Drift alarm must fire on an injected shift
        run: |
          if uv run python -m drift.run --source synthetic --no-evidently \
               --train-stride-hours 12 --num-boost-round 60 \
               --simulate-shift 12000 --fail-on-retrain --out /tmp/smoke/drift_shift.json; then
            echo "::error::a +12,000 MW injected level shift did NOT trigger a retrain verdict"
            exit 1
          fi

      # M5: the whole loop through the entrypoint the daily cron calls — ingest
      # is skipped so CI touches no network. This is the step that would catch a
      # broken chain before the cron does.
      - name: Daily pipeline smoke test (synthetic fixture, no network)
        run: |
          uv run python -m pipeline.daily --source synthetic --skip-ingest \
            --no-evidently --train-stride-hours 12 --num-boost-round 60 \
            --out-dir /tmp/smoke/metrics
          test -s /tmp/smoke/metrics/forecast.json
          test -s /tmp/smoke/metrics/monitor.json
          test -s /tmp/smoke/metrics/drift.json
          test -s /tmp/smoke/metrics/forecast_vs_actual.png

      # The workflow's own fail-fast. Without a key and with --require-eia-key
      # the entrypoint must exit 2 and write nothing at all.
      - name: The daily entrypoint must refuse to publish without a key
        env:
          EIA_API_KEY: ""
        run: |
          set +e
          uv run python -m pipeline.daily --require-eia-key --out-dir /tmp/nokey
          code=$?
          set -e
          if [ "$code" != "2" ]; then
            echo "::error::--require-eia-key should exit 2 without a key, got $code"
            exit 1
          fi
          if [ -d /tmp/nokey ] && [ -n "$(ls -A /tmp/nokey)" ]; then
            echo "::error::the pipeline wrote artifacts despite refusing to run"
            exit 1
          fi

      - name: MLflow run state must never be committed
        run: |
          if git ls-files | grep -E '^(mlruns|mlartifacts)/|\.db$'; then
            echo "::error::mlruns/ or a database file is tracked — they are local run state"
            exit 1
          fi

      - name: Metrics must stay small (this folder is the published artifact)
        run: |
          if find metrics -type f -size +5M | grep -q .; then
            echo "::error::a file in metrics/ exceeds 5MB"
            exit 1
          fi

      # The honesty contract on the published artifacts. `uv run pytest` above
      # already covers tests/test_artifacts.py, but naming it as its own step
      # means a failure reads as "a committed artifact makes a false claim about
      # its own provenance" in the checks list, rather than as one dot among 180.
      - name: Committed artifacts must not misstate their provenance
        run: uv run pytest tests/test_artifacts.py -v

      # Belt and braces on the same property, independent of pytest: no
      # published artifact may pair is_real=true with a synthetic fixture.
      # This one keeps working even if the test file is deleted.
      - name: No artifact may claim real data while carrying a fixture
        run: |
          uv run python - <<'PY'
          import json, pathlib, sys
          bad = []
          for p in sorted(pathlib.Path("metrics").glob("*.json")):
              d = json.loads(p.read_text(encoding="utf-8"))
              if "is_real" not in d:
                  bad.append(f"{p}: no top-level is_real")
                  continue
              kind = (d.get("data") or {}).get("kind")
              if d["is_real"] and kind == "synthetic_fixture":
                  bad.append(f"{p}: is_real=true with kind=synthetic_fixture")
              if not d["is_real"] and not d.get("warning"):
                  bad.append(f"{p}: synthetic but carries no warning")
          for line in bad:
              print(f"::error::{line}")
          sys.exit(1 if bad else 0)
          PY
