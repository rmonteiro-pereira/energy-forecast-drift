# Mutation testing — this workflow genuinely runs.
#
# It is NOT part of `ci.yml`: a full pass takes ~25 minutes, which is the wrong
# cost on every push and the kind of slow job people learn to skip. The original
# conclusion drawn from that (docs/adr/0007) was "so run it on a schedule
# instead", and that conclusion was wrong. Mutation testing measures the strength
# of the test suite, and a test suite only changes in a commit. A calendar
# trigger therefore fires precisely when nothing changed, and stays silent when
# something did:
#
#   * it cannot attribute. A red Monday 04:40 has no culprit commit — it has a
#     week of them — and this job exists declaredly to catch *regression*, on the
#     grounds that weakening a test is invisible because a weaker test still
#     passes. A regression detector that detects without accusing is half a tool.
#   * it is late. A test weakened on Tuesday surfaces six days and twenty commits
#     later, by which point the change is no longer under review.
#
# So the trigger is `pull_request`, narrowed by `paths` to the files that can
# actually move the score: the two mutated modules, the seven test files that
# drive them, **every first-party module those nine import**, the lockfile, and
# the mutation tooling. Those PRs are the minority, so the 25 minutes are paid
# only where they can buy something — and the "wrong cost on every push"
# objection stops applying, because it is no longer every push.
#
# The schedule stays, but its remit is narrower than first claimed here.
# "Dependency change does not arrive in a commit" is false for this repository:
# Dependabot has opened four PRs against it, so most of it does — which is why
# `uv.lock` is now in the filter, where the trigger that can name the commit
# catches it. What is left for the cron is the residue: a transitive bump no PR
# here ever names, a yanked release, a runner image that moves underneath us.
# Real, but smaller than the sentence that used to stand here.
#
# What it must never be is theatre. There is no `if: false` here, the paths it
# mutates are asserted to exist by tests/test_mutation_config.py, and the score
# is written to the job summary on every run so it can be read without digging
# through logs. If this job is green, mutmut actually executed.
#
# Why a floor instead of trusting mutmut's exit code: `mutmut run` exits
# non-zero whenever *any* mutant survives, which is permanently true here and
# says nothing about whether things got worse. scripts/mutation_score.py reads
# the score and fails only on a regression — weakening a test is otherwise
# invisible, because a weaker test still passes.

name: mutation testing

on:
  # The trigger that attributes: only on PRs that touch something able to change
  # the score. Everything else in the repo can be reviewed without paying 25
  # minutes, and a PR that does touch these gets its verdict while it is open.
  #
  # Note the granularity, which is easy to get wrong: on `pull_request`, `paths`
  # is evaluated against the **whole PR diff versus the base**, not against the
  # individual push. So once a PR touches one of these files, every later push to
  # it re-runs this job — including a docs-only follow-up commit. Combined with
  # `cancel-in-progress` below, that means the verdict always belongs to the
  # current head and the intermediate 36-minute runs are cancelled, which is the
  # trade we want: a stale verdict is worse than a missing one.
  pull_request:
    paths:
      # The two mutated modules...
      - "drift/detectors.py"
      - "models/backtest.py"
      # ...and the seven test files named in `[tool.mutmut].runner`, which are
      # the only tests that can kill or fail to kill a mutant. Not `tests/**`:
      # most test files here cannot move this number, and making an unrelated
      # docs PR wait 25 minutes is how a job gets routed around.
      # `tests/test_mutation_config.py` asserts this list matches the runner, so
      # the two cannot drift apart.
      - "tests/test_drift_detectors.py"
      - "tests/test_drift_boundaries.py"
      - "tests/test_drift_timeline.py"
      - "tests/test_drift_trigger.py"
      - "tests/test_backtest.py"
      - "tests/test_backtest_accounting.py"
      - "tests/test_baseline.py"
      # ...and every first-party module those nine files import, directly or
      # transitively. The first version of this filter omitted all of them and
      # was wrong: `drift/config.py` holds the `DEFAULT_THRESHOLDS` the boundary
      # tests pin, so editing a threshold changes what `drift/detectors.py`'s
      # mutants do while touching no filtered path.
      # `tests/test_mutation_config.py` recomputes this closure from the import
      # graph and fails if anything is missing, so the list cannot silently rot.
      - "drift/**"
      - "features/**"
      - "models/**"
      - "ingest/config.py"
      - "ingest/store.py"
      # The lockfile. `uv sync --frozen` installs exactly this, so a pandas,
      # numpy or lightgbm bump changes behaviour under a suite nobody touched
      # while matching none of the paths above. That was offered as the reason
      # to keep the cron — wrongly, for this repo: Dependabot has already opened
      # four PRs here, so most dependency change *does* arrive in a commit, and
      # a commit should be caught by the trigger that can attribute it rather
      # than left for Monday. The cron's real remit is narrower than the comment
      # above it claimed: a transitive bump that no PR here ever names.
      - "uv.lock"
      # ...and the tooling that decides the verdict.
      - "pyproject.toml"
      - "scripts/mutation_score.py"
      - "scripts/mutation_survivors.py"
      - ".github/workflows/mutation.yml"
  schedule:
    # 04:40 UTC on Mondays — for dependency drift, not for the suite. See the
    # header. Off the hour: GitHub throttles the top-of-hour stampede and delays
    # those runs.
    - cron: "40 4 * * 1"
  workflow_dispatch:
    inputs:
      floor:
        description: "Fail if the overall mutation score falls below this percentage"
        type: string
        # 66, measured here, on this runner. See `env.FLOOR` below for why that
        # sentence carries the whole weight. Keep the two equal.
        default: "66"

permissions:
  contents: read

env:
  # ---------------------------------------------------------------------------
  # THE FLOOR — 66, and every word of the derivation matters.
  #
  # The previous value was 65, read off `docs/MUTATION-TESTING.md`'s published
  # "65.0%". Two things were wrong with that, and together they made this gate
  # fail on green code:
  #
  #   1. 65.0% is 308/474 = 64.9789% rounded for display, and the script compared
  #      the *raw* value. The gate therefore rejected the exact measurement that
  #      set it. scripts/mutation_score.py now compares the number it reports.
  #   2. 308/474 was measured on Windows, where 9 mutants come back `untested`
  #      and count as not-killed. This runner produces none.
  #
  # So the floor is set from a run on *this* runner, at the commit it gates:
  #
  #   run 30680545024, workflow_dispatch at 41e5d02, ubuntu-latest, floor 1
  #   -> 316 killed / 474 = 66.7%, raw statuses {ok_killed: 316,
  #      bad_survived: 158}, no `untested` bucket at all.
  #
  # Against the Windows figure that is +8 killed and +1 survivor — the 9
  # `untested` resolving, 8 one way and 1 the other. The two platforms genuinely
  # disagree by 1.7 points, and a floor picked from the wrong one is a coin flip.
  #
  # 66 leaves ~3 mutants of headroom under 66.7%. That is deliberately tight: a
  # ratchet with ten points of slack does not ratchet. Raise it when the score
  # rises; do not lower it without saying why in the same commit.
  # ---------------------------------------------------------------------------
  FLOOR: "66"

# Per-ref, not global. A single `mutation-testing` group meant one PR's run
# cancelled another's, and the cancelled one is indistinguishable from a run that
# never happened.
concurrency:
  group: mutation-testing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutate:
    runs-on: ubuntu-latest
    # A full pass took ~25 min locally and **36 min on this runner** (measured:
    # run 30680545024, 02:42:42Z -> 03:19:07Z) over 474 mutants. 60 leaves
    # headroom for a slower box without hanging forever if something goes wrong.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      # Fail loudly and immediately if the config points at files that do not
      # exist. A mutation config aimed at a missing directory reports a perfect
      # score over zero mutants, which is worse than not running at all.
      - name: The mutation config must point at real files
        run: uv run pytest tests/test_mutation_config.py -v

      - name: Run mutmut
        # mutmut exits non-zero whenever any mutant survives, which is expected.
        # The verdict comes from the score, not from this exit code.
        run: uv run mutmut run || true

      - name: Report the score and enforce the floor
        env:
          # `inputs.floor` is set only by workflow_dispatch; on a pull request or
          # the schedule it is empty, and the shell default supplies FLOOR from
          # the workflow env above. Done in the shell rather than with
          # `${{ inputs.floor || env.FLOOR }}` so an empty value can never reach
          # argparse as `--floor ""`.
          DISPATCH_FLOOR: ${{ inputs.floor }}
        run: |
          uv run python scripts/mutation_score.py \
            --floor "${DISPATCH_FLOOR:-$FLOOR}" \
            --survivors 30 | tee "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

      # Every surviving mutant must be either killed or given a written reason.
      # A report that lists hundreds of survivors and decides nothing about any
      # of them looks rigorous and is not — the number gets quoted, the
      # survivors never get read. This step fails when a survivor matches no
      # rule in scripts/mutation_survivors.py, so a new one cannot quietly join
      # the pile unexamined.
      - name: Every surviving mutant must be adjudicated
        run: |
          uv run python scripts/mutation_survivors.py --check \
            | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

      # `include-hidden-files` is required, not optional. `.mutmut-cache` starts
      # with a dot, and upload-artifact has excluded hidden files by default
      # since v4 — so without this the upload finds nothing and
      # `if-no-files-found: error` fails the job *after* a 25-minute run. Found
      # while triaging the v4 -> v7 bump, and it was already wrong at v4.
      - name: Upload the mutation cache
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-cache-${{ github.run_id }}
          path: .mutmut-cache
          include-hidden-files: true
          if-no-files-found: error
